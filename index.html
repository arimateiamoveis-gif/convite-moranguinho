<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🎀 1 Aninho - Moranguinho 🍓</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(145deg, #ffe4ec, #ffb6c1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 60px;
            padding: 30px 25px 35px;
            box-shadow: 0 25px 50px rgba(200,50,80,0.3);
            border: 4px solid #ff85a2;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: "🍓🍓🍓";
            font-size: 40px;
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            text-align: center;
            opacity: 0.15;
            letter-spacing: 30px;
            pointer-events: none;
        }
        .header h1 {
            font-size: 2.2rem;
            color: #b3405a;
            text-shadow: 3px 3px 0 #ffccd5;
            text-align: center;
        }
        .header h1 small {
            display: block;
            font-size: 1.1rem;
            color: #d45a7a;
        }
        .foto-container {
            border-radius: 40px;
            overflow: hidden;
            margin: 15px 0 20px;
            border: 4px solid #ffb3c6;
            box-shadow: 0 8px 0 #d4707a;
            background: #fff0f5;
        }
        .foto-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .convite-texto {
            background: #fffbf0;
            border-radius: 40px;
            padding: 25px 20px;
            border: 3px dashed #e8839a;
            text-align: center;
        }
        .convite-texto .destaque {
            font-size: 2rem;
            font-weight: 900;
            color: #c44a6a;
            display: block;
        }
        .convite-texto .destaque small {
            font-size: 1.2rem;
            font-weight: 600;
            color: #8f334b;
            display: block;
        }
        .convite-texto .mensagem {
            font-size: 1.2rem;
            color: #5e2e3a;
            margin-top: 10px;
        }
        .info-festa {
            background: #ffd9e0;
            border-radius: 60px;
            padding: 12px 18px;
            display: inline-block;
            font-weight: 700;
            color: #8f334b;
            margin-top: 12px;
        }
        .info-festa a {
            color: #b3405a;
            text-decoration: underline;
            font-weight: bold;
        }
        .botoes {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 25px 0 15px;
        }
        .btn {
            border: none;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.12);
            flex: 1;
            transition: all 0.2s;
        }
        .btn-sim { background: #f57c9a; color: white; }
        .btn-sim:hover { background: #e86283; transform: scale(1.02); }
        .btn-nao { background: #d3d3d3; color: #4a4a4a; }
        .btn-nao:hover { background: #bfbfbf; }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.12); }
        .mensagem-retorno {
            font-size: 1.2rem;
            background: #d4edda;
            border-radius: 60px;
            padding: 14px;
            display: none;
            margin-top: 15px;
            border: 2px solid #a3d8b5;
        }
        .mensagem-retorno.visivel { display: block; animation: fade 0.5s; }
        @keyframes fade { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
        .rodape {
            text-align: center;
            margin-top: 20px;
            color: #b26a7a;
            font-size: 0.9rem;
        }

        /* BOTÃO MORANGO ADMIN */
        .admin-strawberry {
            position: relative;
            display: inline-block;
            margin-top: 12px;
            cursor: pointer;
            font-size: 2rem;
            transition: transform 0.3s;
            background: none;
            border: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .admin-strawberry:hover {
            transform: scale(1.15) rotate(-8deg);
        }
        .admin-strawberry:active {
            transform: scale(0.9);
        }
        .admin-tooltip {
            font-size: 0.65rem;
            color: #c47a8a;
            display: block;
            margin-top: 2px;
        }

        /* MODAL ADMIN */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.aberto {
            display: flex;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .modal {
            background: white;
            border-radius: 60px 60px 40px 40px;
            max-width: 450px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            border: 4px solid #ff85a2;
            position: relative;
        }
        .modal h2 {
            color: #b3405a;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .modal .fechar {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            color: #b3405a;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.2s;
        }
        .modal .fechar:hover { transform: rotate(90deg); }
        .modal .senha-input {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .modal .senha-input input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 60px;
            border: 2px solid #f5b1b1;
            font-size: 1rem;
            min-width: 130px;
            outline: none;
        }
        .modal .senha-input button {
            background: #b3405a;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .modal .senha-input button:hover { background: #a1344e; }
        .modal .stats {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .modal .stats span {
            background: #f5f5f5;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .modal .stats .total { background: #f57c9a; color: white; }
        .modal .stats .sim { background: #4caf50; color: white; }
        .modal .stats .nao { background: #f44336; color: white; }
        .modal ul {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .modal ul li {
            background: #fafafa;
            border-radius: 40px;
            padding: 10px 16px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #f57c9a;
            font-size: 0.95rem;
        }
        .modal ul li .badge {
            background: #f57c9a;
            color: white;
            border-radius: 40px;
            padding: 2px 14px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .modal ul li small {
            color: #999;
            font-size: 0.65rem;
        }
        .mensagem-erro {
            color: #d32f2f;
            font-size: 0.9rem;
            text-align: center;
            margin: 8px 0;
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 1.8rem; }
            .convite-texto .destaque { font-size: 1.6rem; }
            .btn { font-size: 1.1rem; padding: 14px 20px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>🍓 1 aninho 🍓<small>da nossa princesinha</small></h1>
    </div>

    <div class="foto-container">
        <img src="foto.jpg" alt="Foto da aniversariante" />
    </div>

    <div class="convite-texto">
        <span class="destaque">
            VENHA COMEMORAR COMIGO!
            <small>VOCÊ É MEU CONVIDADO ESPECIAL!</small>
        </span>
        <div class="mensagem">
            Estou crescendo e vou fazer <strong>1 ano</strong>!<br>
            Quero muito você na minha festa 🎈
        </div>
        <div class="info-festa">
            📅 19 de Setembro · 14h &nbsp;|&nbsp;
            <a href="https://maps.app.goo.gl/qfi1f1E9WsPWSTPq6" target="_blank">📍 Top Kid Riacho Fundo 2</a>
        </div>
    </div>

    <div class="botoes">
        <button class="btn btn-sim" id="btnSim">🍓 VOU SIM!</button>
        <button class="btn btn-nao" id="btnNao">😔 Não vou</button>
    </div>

    <div class="mensagem-retorno" id="mensagemRetorno"></div>

    <div class="rodape">
        💖 Traga um sorriso, leve um moranguinho
        <button class="admin-strawberry" id="btnAdmin">
            🍓
            <span class="admin-tooltip">Área da Mamãe</span>
        </button>
    </div>
</div>

<!-- MÚSICA INVISÍVEL (YOUTUBE) -->
<div style="position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; overflow:hidden;">
    <iframe id="youtubePlayer" width="1" height="1" src="https://www.youtube.com/embed/Ez32I7jLzmM?autoplay=1&loop=1&playlist=Ez32I7jLzmM" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<script>
    // Inicialização do Firebase (já existente)
    const firebaseConfig = {
        apiKey: "SEU_API_KEY",
        authDomain: "SEU_PROJETO.firebaseapp.com",
        projectId: "SEU_PROJETO_ID",
        storageBucket: "SEU_PROJETO.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const respostasRef = db.collection("respostas");

    // Elementos do convite
    const btnSim = document.getElementById('btnSim');
    const btnNao = document.getElementById('btnNao');
    const msgRetorno = document.getElementById('mensagemRetorno');

    // Música invisível: tenta tocar ao carregar
    (function() {
        var iframe = document.getElementById("youtubePlayer");
        function tocar() {
            // Recarrega o iframe para forçar o autoplay
            iframe.src = "https://www.youtube.com/embed/Ez32I7jLzmM?autoplay=1&loop=1&playlist=Ez32I7jLzmM";
        }
        window.addEventListener("load", function() {
            // Toca imediatamente
            tocar();
            // Se falhar, o usuário clica em qualquer lugar para ativar
            document.addEventListener("click", function() {
                var src = iframe.src;
                if (src.indexOf("autoplay=1") === -1) {
                    tocar();
                }
            }, { once: true });
            document.addEventListener("touchstart", function() {
                var src = iframe.src;
                if (src.indexOf("autoplay=1") === -1) {
                    tocar();
                }
            }, { once: true });
        });
    })();

    // Funções de resposta e admin (mantidas do original)

</script>
</body>
</html>
