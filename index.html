<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 1 Aninho - Moranguinho 🍓</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(145deg, #ffe4ec, #ffb6c1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 60px;
            padding: 30px 25px 35px;
            box-shadow: 0 25px 50px rgba(200,50,80,0.3);
            border: 4px solid #ff85a2;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: "🍓🍓🍓";
            font-size: 40px;
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            text-align: center;
            opacity: 0.15;
            letter-spacing: 30px;
        }
        .header h1 {
            font-size: 2.2rem;
            color: #b3405a;
            text-shadow: 3px 3px 0 #ffccd5;
            text-align: center;
        }
        .header h1 small {
            display: block;
            font-size: 1.1rem;
            color: #d45a7a;
        }
        .foto-container {
            border-radius: 40px;
            overflow: hidden;
            margin: 15px 0 20px;
            border: 4px solid #ffb3c6;
            box-shadow: 0 8px 0 #d4707a;
        }
        .foto-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .convite-texto {
            background: #fffbf0;
            border-radius: 40px;
            padding: 25px 20px;
            border: 3px dashed #e8839a;
            text-align: center;
        }
        .convite-texto .destaque {
            font-size: 2rem;
            font-weight: 900;
            color: #c44a6a;
            display: block;
        }
        .convite-texto .destaque small {
            font-size: 1.2rem;
            font-weight: 600;
            color: #8f334b;
            display: block;
        }
        .info-festa {
            background: #ffd9e0;
            border-radius: 60px;
            padding: 12px 18px;
            display: inline-block;
            font-weight: 700;
            color: #8f334b;
            margin-top: 12px;
        }
        .botoes {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 25px 0 15px;
        }
        .btn {
            border: none;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.12);
            flex: 1;
        }
        .btn-sim { background: #f57c9a; color: white; }
        .btn-nao { background: #d3d3d3; color: #4a4a4a; }
        .mensagem-retorno {
            font-size: 1.2rem;
            background: #d4edda;
            border-radius: 60px;
            padding: 14px;
            display: none;
        }
        .mensagem-retorno.visivel { display: block; }
        .admin-panel {
            margin-top: 30px;
            background: #ffeef2;
            border-radius: 30px;
            padding: 20px;
            display: none;
        }
        .admin-panel.visivel { display: block; }
        .senha-input {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .senha-input input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 60px;
            border: 2px solid #f5b1b1;
            min-width: 130px;
        }
        .senha-input button {
            background: #b3405a;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 700;
            cursor: pointer;
        }
        .admin-panel ul {
            list-style: none;
            padding: 0;
            margin-top: 12px;
        }
        .admin-panel li {
            background: white;
            border-radius: 40px;
            padding: 10px 18px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            border-left: 6px solid #f57c9a;
        }
        .admin-panel .badge {
            background: #f57c9a;
            color: white;
            border-radius: 40px;
            padding: 4px 16px;
            font-weight: 700;
        }
        .rodape {
            text-align: center;
            margin-top: 20px;
            color: #b26a7a;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🍓 1 aninho 🍓<small>da nossa princesinha</small></h1>
    </div>
    <div class="foto-container">
        <img src="foto.jpg" alt="Foto da aniversariante" />
    </div>
    <div class="convite-texto">
        <span class="destaque">
            VENHA COMEMORAR COMIGO!
            <small>VOCÊ É MEU CONVIDADO ESPECIAL!</small>
        </span>
        <div style="font-size:1.2rem; color:#5e2e3a; margin-top:10px;">
            Estou crescendo e vou fazer <strong>1 ano</strong>!<br>
            Quero muito você na minha festa 🎈
        </div>
        <div class="info-festa">📅 08 de Agosto · 14h &nbsp;|&nbsp; 📍 Casa da vovó</div>
    </div>
    <div class="botoes">
        <button class="btn btn-sim" id="btnSim">🍓 VOU SIM!</button>
        <button class="btn btn-nao" id="btnNao">😔 Não vou</button>
    </div>
    <div class="mensagem-retorno" id="mensagemRetorno"></div>
    <div class="rodape">💖 Traga um sorriso, leve um moranguinho</div>
    <div class="admin-panel" id="adminPanel">
        <h3 style="color:#a13b55;">🍓 Painel da Mamãe</h3>
        <div class="senha-input">
            <input type="password" id="senhaAdmin" placeholder="Digite a senha" />
            <button id="btnAbrirAdmin">🔓 Ver respostas</button>
        </div>
        <ul id="lista"></ul>
    </div>
</div>
<script>
    document.getElementById('btnSim').onclick = function() {
        var nome = prompt("Qual o seu nome? 💕");
        if(nome) {
            var msg = document.getElementById('mensagemRetorno');
            msg.textContent = "🍓 Uhuuu! Te esperamos com muito carinho!";
            msg.className = "mensagem-retorno visivel";
            document.querySelectorAll('.btn').forEach(b => b.style.display = 'none');
        }
    };
    document.getElementById('btnNao').onclick = function() {
        var nome = prompt("Qual o seu nome? 💕");
        if(nome) {
            var msg = document.getElementById('mensagemRetorno');
            msg.textContent = "💔 Ah, que pena... mas obrigada por responder!";
            msg.className = "mensagem-retorno visivel";
            document.querySelectorAll('.btn').forEach(b => b.style.display = 'none');
        }
    };
    document.getElementById('btnAbrirAdmin').onclick = function() {
        var senha = document.getElementById('senhaAdmin').value;
        if(senha === "morango2026") {
            document.getElementById('adminPanel').classList.add('visivel');
            document.getElementById('lista').innerHTML = 
                "<li><span>👩 Maria</span><span class='badge'>✅ Vai</span></li>" +
                "<li><span>👨 João</span><span class='badge'>✅ Vai</span></li>" +
                "<li><span>👩 Ana</span><span class='badge'>❌ Não vai</span></li>";
        } else {
            alert("Senha incorreta!");
        }
    };
</script>
</body>
</html>
